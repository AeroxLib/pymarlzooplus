# --- CMT specific parameters ---

# use epsilon greedy action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 100000
evaluation_epsilon: 0.0

runner: "episode"

# Buffer (参考 TGCNet)
buffer_size: 5000
batch_size: 32
prioritized_buffer: False
prioritized_buffer_alpha: 0.6

# update the target network every {} episodes
target_update_interval_or_tau: 200

# 参考 TGCNet 设置
t_max: 2050000
learner_log_interval: 10000
log_interval: 10000
runner_log_interval: 10000
test_interval: 10000
test_nepisode: 32

obs_agent_id: True
obs_last_action: True
obs_individual_obs: False

# use the CMT_Learner to train (修正：原来是 q_learner)
standardise_returns: False
standardise_rewards: True
agent_output_type: "q"
learner: "cmt_learner"          # ✅ 修正：使用 cmt_learner 而不是 q_learner
agent: "cmt"                   # ✅ 新增：使用 cmt agent 而不是 rnn
mac: "cmt_mac"                 # ✅ 新增：使用 cmt_mac 而不是 basic_mac
double_q: True
use_rnn: True
mixer: "qmix"
mixing_embed_dim: 32
hypernet_layers: 2
hypernet_embed: 64

# CMT 特有参数
k_budget: 2                     # ✅ 新增：HybridRouting 的 Top-K 邻居数
lambda_c: 0.1                   # ✅ 新增：因果奖励权重
hidden_dim: 128                 # ✅ 新增：隐藏层维度 (参考 TGCNet 用 128)

# [Baseline 实验] 关闭所有辅助 Loss，验证 QMIX 骨干能否学会
moa_weight: 0.0                 # 关闭 MOA loss

# MAGI 系数 (控制压缩程度)
beta: 0.0                       # 关闭 KL loss

# Sparsity 系数 (控制路由有多稀疏)
# 如果发现连接全断了，把这个调小；如果发现全是全连接，把这个调大
l0_weight: 0.0                  # 关闭稀疏 loss

name: "cmt"
batch_size_run: 4

# ==========================================
# Adaptive Topology Pruning (课程退火策略)
# ==========================================
# 目标：在保证性能的前提下，将通信量降低到30%

l0_weight: 0.0001              # 稀疏惩罚目标最大权重
l0_start_step: 100000          # Warm-up步数：前10w步不惩罚，让模型先学会赢
l0_anneal_time: 400000         # 退火步数：从10w到50w步线性增加惩罚
